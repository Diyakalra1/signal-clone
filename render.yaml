services:
  - type: web
    name: signal-clone-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: FRONTEND_ORIGIN_REGEX
        value: ^https://[a-zA-Z0-9-]+\.vercel\.app$
      - key: FRONTEND_ORIGINS
        sync: false
      - key: SEED_DEMO_DATA
        value: "true"
